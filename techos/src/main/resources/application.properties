# Endereço do banco de dados
# createDatabaseIfNotExist=true: cria o schema "techos" sozinho se ele ainda não existir
spring.datasource.url=jdbc:mysql://localhost:3306/techos?createDatabaseIfNotExist=true

# Usuario do banco de dados
spring.datasource.username=root

# senha do banco de dados
spring.datasource.password=

# update: o spring JPA irá atualizar o banco de dados automaticamente, caso seja necessário
spring.jpa.hibernate.ddl-auto=update

# mostra no terminal o SQL gerado pelo hibernate
spring.jpa.show-sql=true

# Desenvolvimento: alterou um .html, aperte F5 no navegador e a mudança aparece
spring.thymeleaf.cache=false